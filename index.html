<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NTT DATA人口ブラックジャック MVP</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="title-area" aria-labelledby="app-title">
        <div>
          <p class="eyebrow">Firebase Realtime Database MVP</p>
          <h1 id="app-title">NTT DATA人口ブラックジャック</h1>
        </div>
        <div class="target-pill">
          <span>TARGET</span>
          <strong id="targetLabel">200,000</strong>
        </div>
      </section>

      <section id="setupView" class="panel setup-panel">
        <div class="field-grid">
          <label>
            表示名
            <input id="playerNameInput" type="text" maxlength="20" placeholder="Player">
          </label>
          <label>
            部屋ID
            <input id="roomIdInput" type="text" maxlength="8" placeholder="ABC123">
          </label>
        </div>
        <div class="button-row">
          <button id="createRoomButton" type="button">部屋を作る</button>
          <button id="joinRoomButton" type="button" class="secondary">部屋IDで参加</button>
        </div>
        <p id="setupMessage" class="message" role="status"></p>
      </section>

      <section id="gameView" class="game-grid hidden" aria-live="polite">
        <div class="panel room-panel">
          <div>
            <p class="label">部屋ID</p>
            <div class="room-code" id="roomCode">------</div>
          </div>
          <div>
            <p class="label">状態</p>
            <div class="state-text" id="roomState">待機中</div>
          </div>
          <button id="startGameButton" type="button" class="hidden">ゲーム開始</button>
        </div>

        <section class="panel play-panel" aria-labelledby="candidateTitle">
          <div class="score-row">
            <div>
              <p class="label">あなたの現在人口</p>
              <div class="score" id="myTotal">0</div>
            </div>
            <div>
              <p class="label">HIT回数</p>
              <div class="hit-count" id="myHitCount">0</div>
            </div>
          </div>

          <div class="candidate-box">
            <p class="label" id="candidateTitle">次の市区町村</p>
            <h2 id="candidateName">待機中</h2>
            <p id="candidatePrefecture">2人そろったら開始できます</p>
            <p class="unknown" id="candidatePopulation">人口：?????</p>
          </div>

          <div class="button-row">
            <button id="hitButton" type="button" disabled>HIT</button>
            <button id="standButton" type="button" class="secondary" disabled>STAND</button>
          </div>
          <p id="myStatus" class="message"></p>
        </section>

        <section class="panel opponent-panel" aria-labelledby="opponentTitle">
          <h2 id="opponentTitle">相手</h2>
          <div class="opponent-stats">
            <div>
              <p class="label">表示名</p>
              <strong id="opponentName">参加待ち</strong>
            </div>
            <div>
              <p class="label">現在人口</p>
              <strong id="opponentTotal">0</strong>
            </div>
            <div>
              <p class="label">状態</p>
              <strong id="opponentStatus">待機中</strong>
            </div>
            <div>
              <p class="label">HIT回数</p>
              <strong id="opponentHitCount">0</strong>
            </div>
          </div>
        </section>

        <section id="resultPanel" class="panel result-panel hidden" aria-labelledby="resultTitle">
          <p class="label">RESULT</p>
          <h2 id="resultTitle">結果待ち</h2>
          <p id="resultDetail"></p>
          <button id="leaveRoomButton" type="button" class="secondary">トップに戻る</button>
        </section>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
